# Legacy case-001 tooling only.
# The assignment workflow uses usb-forensics-assignment-tr:local directly.
services:
  forensic-tools:
    build:
      context: .
      dockerfile: Dockerfile
    image: usb-forensics-tools:local
    network_mode: none
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m
    volumes:
      - ${CASE_DIR:-./case-001}:/case:rw
