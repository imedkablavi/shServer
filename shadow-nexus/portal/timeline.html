<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>Kestrel Senaryo Zaman Sırası</title></head><body><h1>Senaryo Zaman Sırası</h1><p><strong>SENTETİK SENARYO — planlanan sıralamadır; cihaz zaman damgaları değildir.</strong></p><ol><li>Denetim tutarsızlığı tanımlandı.</li><li>Varlık listesi incelendi.</li><li>Devir kaydı istendi.</li><li>Destekleyici notlar toplandı.</li></ol><p>Gerçek cihaz ve sunucu zamanları işlem sırasında ayrı kaydedilmelidir.</p></body></html>
