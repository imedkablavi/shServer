name: Android APK derlemesi
on:
  workflow_dispatch:
  push:
    branches: ["feature/shadow-nexus-evidence-lab"]
    paths:
      - "shadow-nexus/android/**"
      - ".github/workflows/shadow-nexus-android.yml"
  pull_request:
    paths:
      - "shadow-nexus/android/**"
      - ".github/workflows/shadow-nexus-android.yml"

permissions:
  contents: read

jobs:
  apk-derle:
    name: Türkçe Android uygulamasını derle
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK hazırla
        uses: android-actions/setup-android@v3
      - name: Android 35 araçlarını kur
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 8.9 hazırla
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Hata denetimleri ve APK derlemesi
        run: |
          gradle --no-daemon -p shadow-nexus/android clean assembleDebug
          test -s shadow-nexus/android/app/build/outputs/apk/debug/app-debug.apk
      - name: APK dosyasını yayımla
        uses: actions/upload-artifact@v4
        with:
          name: shadow-nexus-kestrel-debug-apk
          path: shadow-nexus/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
