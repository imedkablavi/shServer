name: validation
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  shell-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Existing USB workflow checks
        run: |
          bash -n scripts/usb-forensics
          bash -n scripts/check-syntax.sh
          bash tests/shellcheck-guardrails.sh
      - name: Shadow Nexus smoke checks
        run: bash shadow-nexus/tests/smoke.sh
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: ShellCheck
        run: |
          shellcheck -S warning scripts/usb-forensics scripts/check-syntax.sh tests/shellcheck-guardrails.sh
          shellcheck -S warning shadow-nexus/snctl shadow-nexus/scripts/adb-reverse-start shadow-nexus/scripts/adb-reverse-stop
